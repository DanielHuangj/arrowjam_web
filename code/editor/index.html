<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arrow Jam 关卡编辑器</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <header id="menu-bar" class="menu-bar"></header>
      <div id="main-row" class="main-row">
        <aside id="tool-sidebar" class="tool-sidebar"></aside>
        <div id="center-column" class="center-column">
          <div id="tab-bar" class="tab-bar"></div>
          <div id="breadcrumb" class="breadcrumb hidden"></div>
          <div id="play-toolbar" class="play-toolbar hidden">
            <div id="play-hud" class="play-hud"></div>
            <div id="play-controls" class="play-controls"></div>
          </div>
          <div id="canvas-wrap" class="canvas-wrap">
            <canvas id="board-canvas"></canvas>
            <canvas id="overlay-canvas" class="overlay-canvas"></canvas>
            <div id="hover-tooltip" class="hover-tooltip hidden"></div>
            <div id="play-result-overlay" class="play-result-overlay hidden"></div>
          </div>
        </div>
        <aside id="props-panel" class="props-panel"></aside>
      </div>
      <footer id="status-bar" class="status-bar"></footer>
      <div id="modal-root" class="modal-root hidden"></div>
      <input id="file-input" type="file" accept=".json,application/json" multiple hidden />
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
